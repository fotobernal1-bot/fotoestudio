<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foto Bernal — Generador v7</title>
<!--
FOTO BERNAL v7 — MULTI-PAQUETE
================================
MEDIDAS FOTOS (cm): credR=3.5x4.5 credO=3.5x5 inf=2.5x3 dip=5x7 tit=6x9 f3x35=3.0x3.5(JERUEL)
HOJAS: 4x6=$4 5x7=$7 6x8=$8 6x9=$9 6x10=$10 6x12=$12 8x10=$28 11x14=$70
REGLAS: sep=0.02cm corte guillotina, margen=0.3cm, rotación libre, regalo min5x7 max9.5x8.5
        regalo siempre presente en paquete (no obligatorio por hoja), 300dpi
        encuadre manual por tipo desde el canvas (crops guardados por foto+tipo)
        rotación solo si orientación foto coincide con orientación espacio
ESCUELAS: UACH, SERV_ALEXIA, TIT_ALEXIA, TEC1, JERUEL, CESCIJUC, UNIDEP,
          NORMAL_SUP, INFORAJ, UNAM, CBTCH (11 escuelas con layout verificado)
MULTI-PAQUETE: max 5 paquetes, cada uno con foto(s) fuente, cantidades, folio
               opción combinar paquetes en misma hoja para reducir costo
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap');
:root{
  --bg:#1a1a18;--sur:#242420;--sur2:#2e2e2a;--brd:#3a3a34;
  --acc:#c8a84b;--acc2:#e8c96d;--txt:#e8e4d8;--txt2:#9a9488;
  --red:#c84b4b;--grn:#4bc87a;--blue:#4b8bc8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;}
header{background:var(--sur);border-bottom:2px solid var(--acc);padding:12px 24px;display:flex;align-items:center;gap:12px;}
header img{height:40px;opacity:.92;}
header h1{font-family:'DM Serif Display',serif;font-size:1.3rem;color:var(--acc);}
header span{font-size:.68rem;color:var(--txt2);}
.app{display:grid;grid-template-columns:400px 1fr;flex:1;overflow:hidden;}

/* PANEL IZQUIERDO */
.panel{background:var(--sur);border-right:1px solid var(--brd);display:flex;flex-direction:column;overflow:hidden;max-height:calc(100vh - 68px);}
.panel-top{padding:14px;flex:1;overflow-y:auto;}
.panel-bottom{padding:12px 14px;border-top:1px solid var(--brd);background:var(--sur);display:flex;flex-direction:column;gap:8px;}

/* Global options */
.gopts{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sur2);border-radius:6px;margin-bottom:12px;flex-wrap:wrap;}
.gopts-label{font-size:.68rem;color:var(--txt2);}
.toggle-wrap{display:flex;align-items:center;gap:6px;}
.toggle{position:relative;width:36px;height:20px;cursor:pointer;}
.toggle input{opacity:0;width:0;height:0;}
.tslider{position:absolute;inset:0;background:var(--brd);border-radius:10px;transition:.2s;}
.tslider:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:var(--txt2);border-radius:50%;transition:.2s;}
.toggle input:checked+.tslider{background:var(--acc);}
.toggle input:checked+.tslider:before{transform:translateX(16px);background:#1a1a18;}
.toggle-text{font-size:.68rem;color:var(--txt2);}

/* Paquetes */
.paquetes-list{display:flex;flex-direction:column;gap:10px;}
.paquete{background:var(--sur2);border:1px solid var(--brd);border-radius:8px;overflow:hidden;transition:border-color .2s;}
.paquete.active{border-color:var(--acc);}
.paq-header{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;background:var(--sur2);user-select:none;}
.paq-color{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.paq-name{flex:1;font-size:.78rem;color:var(--txt);font-weight:500;}
.paq-name-input{background:transparent;border:none;color:var(--txt);font-family:'DM Mono',monospace;font-size:.78rem;font-weight:500;width:100%;outline:none;}
.paq-name-input::placeholder{color:var(--txt2);}
.paq-badge{font-size:.6rem;color:var(--txt2);background:var(--sur);border:1px solid var(--brd);border-radius:3px;padding:1px 5px;}
.paq-chevron{font-size:.7rem;color:var(--txt2);transition:transform .2s;}
.paq-chevron.open{transform:rotate(180deg);}
.paq-del{background:none;border:none;color:var(--txt2);cursor:pointer;font-size:.8rem;padding:2px 4px;border-radius:3px;transition:color .15s;}
.paq-del:hover{color:var(--red);}
.paq-body{padding:12px;display:none;border-top:1px solid var(--brd);}
.paq-body.open{display:block;}

/* Fotos fuente dentro de paquete */
.fotos-fuente{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.foto-fuente-item{display:flex;align-items:center;gap:6px;background:var(--sur);border:1px solid var(--brd);border-radius:5px;padding:6px 8px;}
.foto-thumb{width:32px;height:32px;object-fit:cover;border-radius:3px;border:1px solid var(--brd);}
.foto-thumb-ph{width:32px;height:32px;background:var(--brd);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--txt2);flex-shrink:0;}
.foto-info{flex:1;min-width:0;}
.foto-label-input{background:transparent;border:none;color:var(--txt2);font-family:'DM Mono',monospace;font-size:.65rem;width:100%;outline:none;margin-bottom:2px;}
.foto-label-input::placeholder{color:var(--brd);}
.foto-name{font-size:.65rem;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.foto-sel{background:var(--sur);border:1px solid var(--brd);border-radius:3px;color:var(--txt2);font-family:'DM Mono',monospace;font-size:.62rem;padding:2px 4px;cursor:pointer;max-width:120px;}
.foto-sel:focus{outline:none;border-color:var(--acc);}
.foto-tag{vertical-align:middle;}
.btn-add-foto{background:none;border:1px dashed var(--brd);border-radius:4px;color:var(--txt2);cursor:pointer;font-family:'DM Mono',monospace;font-size:.68rem;padding:5px 8px;width:100%;transition:all .15s;text-align:left;}
.btn-add-foto:hover{border-color:var(--acc);color:var(--acc);}

/* Tipos de foto */
.stitle{font-size:.59rem;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin-bottom:7px;border-bottom:1px solid var(--brd);padding-bottom:4px;}
.photo-types{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.photo-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:5px;}
.pl{font-size:.73rem;}
.ps{font-size:.6rem;color:var(--txt2);}
.pg{font-size:.58rem;color:var(--grn);min-height:12px;}
.qty-ctrl{display:flex;align-items:center;gap:2px;}
.qb{background:none;border:1px solid var(--brd);border-radius:4px;color:var(--acc);cursor:pointer;width:22px;height:26px;font-size:.85rem;font-weight:700;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.qb:hover{border-color:var(--acc);background:rgba(200,168,75,.12);}
.qi{background:var(--sur);border:1px solid var(--brd);border-radius:4px;color:var(--txt);font-family:'DM Mono',monospace;font-size:.8rem;padding:4px 4px;text-align:center;width:42px;transition:border-color .15s;}
.qi:focus{outline:none;border-color:var(--acc);}

/* Folio paquete */
.paq-folio{display:grid;grid-template-columns:50px 1fr;align-items:center;gap:6px;margin-top:6px;}
.paq-folio label{font-size:.67rem;color:var(--txt2);}
.fi{background:var(--sur);border:1px solid var(--brd);border-radius:4px;color:var(--txt);font-family:'DM Mono',monospace;font-size:.78rem;padding:4px 8px;transition:border-color .15s;}
.fi:focus{outline:none;border-color:var(--acc);}
select.fi{cursor:pointer;}

/* Botón añadir paquete */
.btn-add-paq{background:none;border:2px dashed var(--brd);border-radius:8px;color:var(--txt2);cursor:pointer;font-family:'DM Mono',monospace;font-size:.74rem;padding:10px;width:100%;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-add-paq:hover{border-color:var(--acc);color:var(--acc);}
.btn-add-paq:disabled{opacity:.3;cursor:not-allowed;}

/* Global wm */
.gwm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.gwm-field{display:flex;align-items:center;gap:4px;}
.gwm-field label{font-size:.65rem;color:var(--txt2);}
.gwm-field input,.gwm-field select{background:var(--sur2);border:1px solid var(--brd);border-radius:4px;color:var(--txt);font-family:'DM Mono',monospace;font-size:.75rem;padding:4px 6px;width:80px;}
.gwm-field input:focus,.gwm-field select:focus{outline:none;border-color:var(--acc);}

/* Resultado */
.rbox{background:var(--sur2);border:1px solid var(--brd);border-radius:6px;padding:10px;font-size:.7rem;line-height:1.8;display:none;max-height:180px;overflow-y:auto;}
.rbox.on{display:block;}
.rsheet{border-left:2px solid var(--acc);padding-left:8px;margin-bottom:6px;}
.rsheet-title{font-size:.75rem;color:var(--acc);font-weight:500;}
.rline{color:var(--txt2);}
.rline b{color:var(--txt);}
.rcost{font-size:.95rem;color:var(--acc);font-family:'DM Serif Display',serif;margin-top:4px;}

/* Botones principales */
.bp{background:var(--acc);color:#1a1a18;border:none;border-radius:6px;font-family:'DM Mono',monospace;font-size:.78rem;font-weight:500;letter-spacing:.08em;padding:10px 14px;cursor:pointer;transition:all .2s;text-transform:uppercase;width:100%;}
.bp:hover{background:var(--acc2);}
.bs{background:transparent;color:var(--txt2);border:1px solid var(--brd);border-radius:6px;font-family:'DM Mono',monospace;font-size:.72rem;padding:8px 14px;cursor:pointer;transition:all .2s;width:100%;}
.bs:hover{border-color:var(--acc);color:var(--acc);}

/* CANVAS AREA */
.ca-wrap{display:flex;flex-direction:column;max-height:calc(100vh - 68px);overflow:hidden;}
.zoom-bar{display:flex;align-items:center;gap:8px;padding:7px 16px;background:var(--sur);border-bottom:1px solid var(--brd);flex-shrink:0;}
.zoom-bar span{font-size:.65rem;color:var(--txt2);}
.zoom-val{color:var(--acc);width:36px;text-align:center;font-size:.72rem;}
.zb{background:none;border:1px solid var(--brd);border-radius:4px;color:var(--acc);cursor:pointer;width:26px;height:26px;font-size:.9rem;font-weight:700;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.zb:hover{border-color:var(--acc);background:rgba(200,168,75,.15);}
.zoom-slider{flex:1;accent-color:var(--acc);cursor:pointer;}
.ca{background:var(--bg);padding:16px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:18px;flex:1;}
.cph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:360px;color:var(--txt2);font-size:.75rem;gap:10px;text-align:center;}
.cph .bi{font-size:2.4rem;opacity:.2;}
.sw{display:flex;flex-direction:column;align-items:center;gap:0;width:100%;}
.slabel{background:var(--sur);border:1px solid var(--acc);border-bottom:none;border-radius:6px 6px 0 0;padding:7px 14px;display:flex;align-items:center;gap:10px;width:100%;}
.slabel-num{font-size:.75rem;color:var(--acc);font-family:'DM Serif Display',serif;}
.slabel-info{font-size:.67rem;color:var(--txt2);}
.slabel-info b{color:var(--txt);}
.slabel-cost{margin-left:auto;font-size:.75rem;color:var(--acc);font-weight:500;}
canvas{border:2px solid var(--acc);border-radius:0 0 4px 4px;max-width:100%;display:block;}
.dlrow{display:flex;gap:8px;justify-content:center;margin-top:6px;}
.bdl{background:var(--sur);color:var(--acc);border:1px solid var(--acc);border-radius:5px;font-family:'DM Mono',monospace;font-size:.7rem;padding:6px 12px;cursor:pointer;transition:all .2s;}
.bdl:hover{background:var(--acc);color:#1a1a18;}
.toast{position:fixed;bottom:16px;right:16px;background:var(--sur2);border:1px solid var(--acc);border-radius:6px;padding:8px 14px;font-size:.72rem;color:var(--acc);transform:translateY(60px);opacity:0;transition:all .28s;z-index:1000;}
.toast.on{transform:translateY(0);opacity:1;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px;}
/* Modal de encuadre */


/* -- MODAL ENCUADRE v2 -- */
.crop-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:2000;display:none;align-items:center;justify-content:center;}
.crop-overlay.open{display:flex;}
.crop-box{background:var(--sur);border:1px solid var(--acc);border-radius:10px;padding:16px;width:95vw;max-width:700px;max-height:94vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
.crop-header{display:flex;align-items:center;justify-content:space-between;}
.crop-header-title{font-family:'DM Serif Display',serif;font-size:1rem;color:var(--acc);}
.crop-close{background:none;border:1px solid var(--brd);border-radius:4px;color:var(--txt2);cursor:pointer;padding:4px 10px;font-size:.8rem;transition:all .15s;}
.crop-close:hover{border-color:var(--red);color:var(--red);}
.crop-canvas-wrap{position:relative;width:100%;background:#111;border-radius:6px;overflow:hidden;border:1px solid var(--brd);touch-action:none;}
.crop-canvas-wrap canvas{display:block;width:100%;height:auto;cursor:grab;}
.crop-hint{font-size:.65rem;color:var(--txt2);padding:4px 2px;}
.crop-actions{display:flex;gap:8px;}
.crop-apply{background:var(--grn);color:#1a1a18;border:none;border-radius:6px;font-family:'DM Mono',monospace;font-size:.78rem;font-weight:500;padding:10px 14px;cursor:pointer;flex:1;}
.crop-cancel{background:transparent;color:var(--txt2);border:1px solid var(--brd);border-radius:6px;font-family:'DM Mono',monospace;font-size:.72rem;padding:8px 14px;cursor:pointer;}
</style>
</head>

// Fecha automática
const now=new Date();
const MESES=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
document.getElementById('wm_mes').value=MESES[now.getMonth()];
document.getElementById('wm_anio').value=now.getFullYear();

// =====================================================
// ESTADO DE PAQUETES
// =====================================================
let paquetes=[];
let paqIdCounter=0;
let zoomLevel=100;

function createPaquete(){
  const id=++paqIdCounter;
  return {
    id,
    nombre:`Cliente ${id}`,
    fotos:[],
    orden:{credR:0,credO:0,inf:0,dip:0,tit:0},
    fotoAsign:{credR:0,credO:0,inf:0,dip:0,tit:0},
    folio:'',
    escuela:'',
    sepMode:'auto',
    collapsed:false,
  };
}

function setEscuela(id, escuelaId){
  const p=paquetes.find(p=>p.id===id);
  if(!p) return;
  p.escuela = escuelaId;
  if(escuelaId){
    const esc = ESCUELAS.find(e=>e.id===escuelaId);
    if(esc){
      // Auto-rellenar cantidades
      Object.keys(p.orden).forEach(t=>p.orden[t]=0);
      Object.assign(p.orden, esc.pedido);
      // Actualizar nombre si aún es genérico
      if(p.nombre.startsWith('Cliente ')) p.nombre = esc.nombre;
    }
  }
  const body=document.querySelector(`#paq_${id} .paq-body`);
  if(body) body.innerHTML=buildPaqBody(p);
  // Actualizar badge
  const badge=document.querySelector(`#paq_${id} .paq-badge`);
  if(badge) badge.textContent=`${totalFotos(p.orden)} fotos`;
}

function setFotoAsign(id,type,val){
  const p=paquetes.find(p=>p.id===id);
  if(!p) return;
  if(!p.fotoAsign) p.fotoAsign={};
  p.fotoAsign[type]=parseInt(val)||0;
  const body=document.querySelector(`#paq_${id} .paq-body`);
  if(body) body.innerHTML=buildPaqBody(p);
}

function setSepMode(id,mode){
  const p=paquetes.find(p=>p.id===id);
  if(!p) return;
  p.sepMode=mode;
  const body=document.querySelector(`#paq_${id} .paq-body`);
  if(body) body.innerHTML=buildPaqBody(p);
}

function getPaqColor(idx){return PAQ_COLORS[idx%PAQ_COLORS.length];}

// =====================================================
// RENDER UI DE PAQUETES
// =====================================================
function renderPaqueteUI(paq,idx){
  const div=document.createElement('div');
  div.className='paquete'+(paq.collapsed?'':' active');
  div.id='paq_'+paq.id;

  // Header
  const hdr=document.createElement('div');
  hdr.className='paq-header';
  hdr.innerHTML=`
    <div class="paq-color" style="background:${getPaqColor(idx)}"></div>
    <input class="paq-name-input" value="${paq.nombre}" placeholder="Nombre del cliente"
      onchange="updatePaqNombre(${paq.id},this.value)"
      onclick="event.stopPropagation()">
    <span class="paq-badge">${totalFotos(paq.orden)} fotos</span>
    <span class="paq-chevron ${paq.collapsed?'':'open'}">▼</span>
    ${paquetes.length>1?`<button class="paq-del" onclick="deletePaq(${paq.id});event.stopPropagation()">✕</button>`:''}
  `;
  hdr.addEventListener('click',()=>togglePaq(paq.id));
  div.appendChild(hdr);

  // Body
  const body=document.createElement('div');
  body.className='paq-body'+(paq.collapsed?'':' open');
  body.innerHTML=buildPaqBody(paq);
  div.appendChild(body);

  return div;
}

function buildPaqBody(paq){
  const fotosHTML=paq.fotos.map((f,fi)=>`
    <div class="foto-fuente-item" id="ffitem_${paq.id}_${fi}">
      ${f.img
        ?`<img class="foto-thumb" src="${f.img.src||f.src}" alt="">`
        :`<div class="foto-thumb-ph">🖼</div>`}
      <div class="foto-info">
        <input class="foto-label-input" value="${f.label}" placeholder="ej: Color, BN, Uniforme..."
          onchange="updateFotoLabel(${paq.id},${fi},this.value)">
        <div class="foto-name">${f.name||'Sin foto'}</div>
        <div style="font-size:.58rem;color:var(--txt2);margin-top:3px;">🖼 Clic en foto del canvas para encuadrar</div>
      </div>
      <button class="foto-del" onclick="deleteFoto(${paq.id},${fi})">✕</button>
    </div>
  `).join('');

  const multiPhoto=paq.fotos.length>1;
  const tiposHTML=TORD.map(t=>{
    const fotoIdx=paq.fotoAsign&&paq.fotoAsign[t]!==undefined?paq.fotoAsign[t]:0;
    const selectorHTML=multiPhoto?`
      <select class="foto-sel" id="fsel_${paq.id}_${t}"
        onchange="setFotoAsign(${paq.id},'${t}',this.value)">
        ${paq.fotos.map((f,fi)=>`
          <option value="${fi}" ${fi===fotoIdx?'selected':''}>${f.label||'Foto '+(fi+1)}</option>
        `).join('')}
      </select>`:'';
    return `
    <div class="photo-row">
      <div>
        <div class="pl">${PT[t].label}${multiPhoto&&paq.fotos[fotoIdx]?` <span class="foto-tag" style="background:${fotoIdx===0?'rgba(200,168,75,.2)':'rgba(75,200,122,.2)'};color:${fotoIdx===0?'var(--acc)':'var(--grn)'};border-radius:3px;padding:0 4px;font-size:.58rem">${paq.fotos[fotoIdx].label}</span>`:''}
        </div>
        <div class="ps">${PT[t].w}×${PT[t].h} cm</div>
        ${multiPhoto?`<div style="margin-top:3px">${selectorHTML}</div>`:''}
        <div class="pg" id="gift_${paq.id}_${t}"></div>
      </div>
      <div class="qty-ctrl">
        <button class="qb" onclick="adjPaq(${paq.id},\x27${t}\x27,-1)">−</button>
        <input class="qi" type="number" min="0" value="${paq.orden[t]||0}"
          id="q_${paq.id}_${t}"
          onchange="setPaqQty(${paq.id},'${t}',this.value)">
        <button class="qb" onclick="adjPaq(${paq.id},\x27${t}\x27,1)">+</button>
      </div>
    </div>`;
  }).join('');

  const escuelaOpts = ESCUELAS.map(e =>
    `<option value="${e.id}" ${paq.escuela===e.id?'selected':''}>${e.nombre}</option>`
  ).join('');

  return `
    <div class="stitle">🏫 Escuela</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      <select class="fi" style="flex:1;font-size:.72rem;"
        onchange="setEscuela(${paq.id},this.value)">
        <option value="">— Sin escuela (manual) —</option>
        ${escuelaOpts}
      </select>
    </div>

    <div class="stitle">📷 Fotos fuente</div>
    <div class="fotos-fuente" id="fotos_${paq.id}">${fotosHTML}</div>
    <button class="btn-add-foto" onclick="addFotoClick(${paq.id})">＋ Agregar foto (color, BN, otra vestimenta...)</button>
    <input type="file" id="ffile_${paq.id}" accept="image/*" style="display:none" onchange="onFotoFile(${paq.id},this)">

    <div class="stitle" style="margin-top:10px">📋 Cantidades pedidas</div>
    <div class="photo-types">${tiposHTML}</div>

    ${paq.fotos.length>1?`
    <div class="sep-mode" style="margin-top:8px;padding:8px 10px;background:var(--sur);border:1px solid var(--brd);border-radius:5px;">
      <div style="font-size:.62rem;color:var(--txt2);margin-bottom:6px;">🗂 Hojas por foto fuente:</div>
      <div style="display:flex;gap:6px;">
        ${['auto','separar','mixto'].map(m=>`
          <button onclick="setSepMode(${paq.id},\x27${m}\x27)"
            style="flex:1;padding:5px 4px;border-radius:4px;font-family:'DM Mono',monospace;font-size:.62rem;cursor:pointer;border:1px solid ${paq.sepMode===m?'var(--acc)':'var(--brd)'};background:${paq.sepMode===m?'rgba(200,168,75,.18)':'var(--sur2)'};color:${paq.sepMode===m?'var(--acc)':'var(--txt2)'};">
            ${m==='auto'?'🤖 Auto':m==='separar'?'📄 Separar':'🔀 Mixto'}
          </button>
        `).join('')}
      </div>
      <div style="font-size:.6rem;color:var(--txt2);margin-top:5px;">
        ${paq.sepMode==='separar'?'Cada foto en su propia hoja':
          paq.sepMode==='mixto'?'Todas las fotos pueden ir en la misma hoja':
          'El algoritmo decide lo más económico'}
      </div>
    </div>`:''}

    <div class="paq-folio">
      <label>Folio #</label>
      <input class="fi" type="text" value="${paq.folio}" placeholder="opcional"
        onchange="updateFolio(${paq.id},this.value)">
    </div>
  `;
}

function refreshPaquetesUI(){
  const list=document.getElementById('paqList');
  list.innerHTML='';
  paquetes.forEach((p,i)=>{
    list.appendChild(renderPaqueteUI(p,i));
  });
  const btn=document.getElementById('btnAddPaq');
  btn.disabled=paquetes.length>=5;
  btn.textContent=`＋ Agregar paquete (${paquetes.length}/5)`;
}

// =====================================================
// ACCIONES DE PAQUETES
// =====================================================
function addPaq(){
  if(paquetes.length>=5){toast('Máximo 5 paquetes');return;}
  // Colapsar los anteriores
  paquetes.forEach(p=>p.collapsed=true);
  const p=createPaquete();
  paquetes.push(p);
  refreshPaquetesUI();
}

function deletePaq(id){
  paquetes=paquetes.filter(p=>p.id!==id);
  if(paquetes.length===0) addPaqSilent();
  refreshPaquetesUI();
}

function addPaqSilent(){
  const p=createPaquete();
  paquetes.push(p);
}

function togglePaq(id){
  const p=paquetes.find(p=>p.id===id);
  if(p) p.collapsed=!p.collapsed;
  refreshPaquetesUI();
}

function updatePaqNombre(id,val){
  const p=paquetes.find(p=>p.id===id);
  if(p) p.nombre=val||`Paquete ${id}`;
}

function updateFolio(id,val){
  const p=paquetes.find(p=>p.id===id);
  if(p) p.folio=val;
}

function adjPaq(id,type,d){
  const p=paquetes.find(p=>p.id===id);
  if(!p) return;
  p.orden[type]=Math.max(0,(p.orden[type]||0)+d);
  const el=document.getElementById(`q_${id}_${type}`);
  if(el) el.value=p.orden[type];
  updateBadge(id);
  updateGiftHint(id,type);
}

function setPaqQty(id,type,val){
  const p=paquetes.find(p=>p.id===id);
  if(!p) return;
  p.orden[type]=Math.max(0,parseInt(val)||0);
  updateBadge(id);
  updateGiftHint(id,type);
}

function updateBadge(id){
  const p=paquetes.find(p=>p.id===id);
  if(!p) return;
  const tot=totalFotos(p.orden);
  const hdr=document.querySelector(`#paq_${id} .paq-badge`);
  if(hdr) hdr.textContent=`${tot} fotos`;
}

function totalFotos(orden){
  return Object.values(orden).reduce((a,b)=>a+b,0);
}

function updateGiftHint(id,type){
  const el=document.getElementById(`gift_${id}_${type}`);
  if(!el) return;
  const p=paquetes.find(p=>p.id===id);
  if(!p) return;
  const qty=p.orden[type]||0;
  if(qty>0){
    const pt=PT[type];
    let extra=1;
    for(const sh of SH){
      const cols=Math.floor((sh.w+GAP)/(pt.w+GAP));
      if(cols===0) continue;
      const rows=Math.floor((sh.h+GAP)/(pt.h+GAP));
      const total=cols*rows;
      if(total>=qty+1){extra=Math.min(2,total-qty);break;}
    }
    el.textContent=`+${extra} extra est.`;
  } else el.textContent='';
}

function addFotoClick(id){
  const el=document.getElementById(`ffile_${id}`);
  if(el) el.click();
}

// =====================================================
// ENCUADRE MANUAL
// Clic en foto del canvas → abre modal con recuadre proporcional al tipo
// Drag X+Y para posicionar. Proporción fija según PT[type].w/h
// Recorte guardado en foto.crops[type] = {sx, sy, sw, sh} en px nativos
// Cada tipo de foto tiene su propio encuadre independiente por foto fuente
// =====================================================
function onFotoFile(id,input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    li(ev.target.result).then(async img=>{
      const p=paquetes.find(p=>p.id===id);
      if(!p) return;
      const label=p.fotos.length===0?'Principal':`Foto ${p.fotos.length+1}`;

      p.fotos.push({img, name:file.name, label, src:ev.target.result, crops:{}});
      const body=document.querySelector(`#paq_${id} .paq-body`);
      if(body) body.innerHTML=buildPaqBody(p);
    });
  };
  reader.readAsDataURL(file);
  input.value='';
}

function deleteFoto(id,fi){
  const p=paquetes.find(p=>p.id===id);
  if(!p) return;
  p.fotos.splice(fi,1);
  const body=document.querySelector(`#paq_${id} .paq-body`);
  if(body) body.innerHTML=buildPaqBody(p);
}

function updateFotoLabel(id,fi,val){
  const p=paquetes.find(p=>p.id===id);
  if(p&&p.fotos[fi]) p.fotos[fi].label=val;
}

// =====================================================
// ALGORITMO DE OPTIMIZACIÓN v2
// Reglas:
//  1. Primero cumplir pedido del cliente
//  2. Siempre 1 extra sin marca por tipo
//  3. Resto del espacio → regalo con marca de agua (publicidad)
//  4. Mínimo 1 regalo con marca por PAQUETE (no por hoja)
//  5. Tipos que nunca llevan marca: credR, credO, inf
//  6. El algoritmo prueba las 4 combinaciones de orientación+rotación
//  7. Elige la hoja más económica que cumpla todo
//  8. Regalo: tamaño calculado automáticamente (mín 5×7 cm, máx 9.5×8.5 cm)
// =====================================================

const SIN_MARCA = new Set(['credR','credO','inf']);

// Calcular cuántas fotos de tipo caben en un área con margen
function capacidad(hojaW, hojaH, fotoW, fotoH){
  const aw = hojaW - 2*MARGIN;
  const ah = hojaH - 2*MARGIN;
  const combos = [
    {cols:Math.floor(aw/fotoW), rows:Math.floor(ah/fotoH), rota:false, horiz:false},
    {cols:Math.floor(aw/fotoH), rows:Math.floor(ah/fotoW), rota:true,  horiz:false},
    {cols:Math.floor(ah/fotoW), rows:Math.floor(aw/fotoH), rota:false, horiz:true},
    {cols:Math.floor(ah/fotoH), rows:Math.floor(aw/fotoW), rota:true,  horiz:true},
  ];
  let mejor = null;
  for(const c of combos){
    const total = c.cols * c.rows;
    if(!mejor || total > mejor.total) mejor = {...c, total};
  }
  return mejor || {cols:0,rows:0,total:0,rota:false,horiz:false};
}

// Calcular tamaño de foto de regalo según espacio disponible
function calcRegaloSize(espacioW, espacioH){
  const w = Math.min(GIFT_MAX_W, Math.max(GIFT_MIN_W, espacioW));
  const h = Math.min(GIFT_MAX_H, Math.max(GIFT_MIN_H, espacioH));
  return {w, h};
}

// Helper: buscar hoja por id
function getSH(id){ return SH.find(s=>s.id===id); }

// Construir resultado desde un layout verificado de escuela
// x,y en zonas y regalos son cm relativos al área útil (se suma MARGIN internamente)
function buildFromLayout(layout, orden, paqId){
  let allSheets = [], totalCost = 0;
  for(const hojaSpec of layout.hojas){
    const sh = getSH(hojaSpec.sh);
    if(!sh) continue;
    const zones = [];

    // Zonas de foto
    for(const z of hojaSpec.zonas){
      const pt = PT[z.type];
      if(!pt) continue;
      const fw = z.pw !== undefined ? z.pw : (z.rot ? pt.h : pt.w);
      const fh = z.ph !== undefined ? z.ph : (z.rot ? pt.w : pt.h);
      const xAbs = MARGIN + (z.x || 0);
      const yAbs = MARGIN + (z.y || 0);
      const w = z.cols * fw + (z.cols-1)*GAP;
      const h = z.rows * fh + (z.rows-1)*GAP;
      const count = z.cols * z.rows;
      const need = z.cliente !== undefined ? z.cliente : (orden[z.type]||0);
      const sinMarca = need + (z.extra||0);
      zones.push({
        type:z.type, x:xAbs, y:yAbs, w, h,
        cols:z.cols, rows:z.rows, count,
        rot:z.rot||false, pw:fw, ph:fh,
        paqId, need, sinMarca,
        marcaEn: z.marcaEn||null,
        regalo: false
      });
    }

    // Zonas de regalo
    if(hojaSpec.regalo){
      for(const r of hojaSpec.regalo){
        const xAbs = MARGIN + (r.x||0);
        const yAbs = MARGIN + (r.y||0);
        zones.push({
          type:'regalo', x:xAbs, y:yAbs,
          cols:1, rows:1, count:1,
          pw:r.w, ph:r.h, w:r.w, h:r.h,
          rot:false, paqId, need:0, sinMarca:0, regalo:true
        });
      }
    }
    const horiz = hojaSpec.horiz || false;
    allSheets.push({sh, ori:horiz?'landscape':'portrait',
                    sw:horiz?sh.h:sh.w, shh:horiz?sh.w:sh.h,
                    layout:{zones}, cost:sh.price, paqIds:[paqId]});
    totalCost += sh.price;
  }
  if(!allSheets.length) return null;
  return {sheets:allSheets, cost:totalCost};
}

// Optimizar un paquete usando el nuevo algoritmo
function optimizeSinglePaqV2(paq){
  const orden = paq.orden;
  const paqId = paq.id;

  // Si la escuela tiene un layout verificado, usarlo directamente
  if(paq.escuela){
    const esc = ESCUELAS.find(e=>e.id===paq.escuela);
    if(esc && esc.layout){
      return buildFromLayout(esc.layout, orden, paqId);
    }
  }

  const tipos = Object.keys(orden).filter(t => orden[t] > 0);
  if(!tipos.length) return null;

  // Calcular cuántas fotos necesitamos en total por tipo
  // cliente + 1 extra sin marca. Si tipo acepta marca, el resto va con marca.
  // Mínimo 1 regalo con marca por paquete.

  let mejorSolucion = null;

  // Intentar en cada hoja disponible
  for(const sh of SH){
    const sol = intentarHoja(sh, tipos, orden, paqId);
    if(!sol) continue;
    if(!mejorSolucion || sol.cost < mejorSolucion.cost){
      mejorSolucion = sol;
    }
  }

  return mejorSolucion;
}

function intentarHoja(sh, tipos, orden, paqId){
  // Estrategia: distribuir tipos en zonas dentro de la hoja
  // Para cada tipo calcular grid óptimo, luego verificar que todo cabe

  const hojaW = sh.w, hojaH = sh.h;
  let zonas = [];
  let tieneRegalo = false;

  // Caso especial: un solo tipo
  if(tipos.length === 1){
    const t = tipos[0];
    const pt = PT[t];
    const clientePide = orden[t];

    // Estrategia de distribución:
    // A) Tipo acepta marca: llenar hoja, sobrante con marca de agua
    // B) Tipo NO acepta marca: reservar espacio para regalo primero, luego calcular fotos
    //    B1) Espacio sobrante natural >= mínimo regalo
    //    B2) Reservar fila/columna de regalo, calcular fotos en espacio restante

    const combosHoja = [
      {hw: hojaW, hh: hojaH, horiz: false},
      {hw: hojaH, hh: hojaW, horiz: true},
    ];
    const combosFoto = [
      {fw: pt.w, fh: pt.h, rota: false},
      {fw: pt.h, fh: pt.w, rota: true},
    ];

    let mejorConfig = null;

    for(const ch of combosHoja){
      for(const cf of combosFoto){
        // Regla visual: rot solo valido si orientacion foto coincide con orientacion espacio
        if(cf.rota){
          const fotoHoriz = cf.fw >= cf.fh; // lado largo foto horizontal
          const espacioHoriz = ch.hw >= ch.hh; // espacio mas ancho que alto
          if(fotoHoriz !== espacioHoriz) continue;
        }
        const aw = ch.hw - 2*MARGIN;
        const ah = ch.hh - 2*MARGIN;

        if(!SIN_MARCA.has(t)){
          // ESTRATEGIA A: tipo acepta marca
          const cols = Math.floor(aw / cf.fw);
          const rows = Math.floor(ah / cf.fh);
          if(cols < 1 || rows < 1) continue;
          const total = cols * rows;
          if(total < clientePide + 1) continue;
          const conMarca = Math.max(1, total - clientePide - 1);
          const extraSinMarca = Math.max(0, total - clientePide - conMarca);
          const cfg = {cols, rows, total, fw:cf.fw, fh:cf.fh, rota:cf.rota,
                       horiz:ch.horiz, tieneRegalo:true, regaloCfg:null,
                       conMarca, extraSinMarca, fotosY: MARGIN};
          if(!mejorConfig || cfg.total > mejorConfig.total) mejorConfig = cfg;

        } else {
          // ESTRATEGIA B: tipo NO acepta marca — necesitamos espacio para regalo

          // B1: espacio sobrante natural
          const cols0 = Math.floor(aw / cf.fw);
          const rows0 = Math.floor(ah / cf.fh);
          if(cols0 >= 1 && rows0 >= 1 && cols0*rows0 >= clientePide + 1){
            const total0 = cols0 * rows0;
            const usadoW = cols0 * cf.fw + (cols0-1)*GAP;
            const usadoH = rows0 * cf.fh + (rows0-1)*GAP;
            const sobW = aw - usadoW;
            const sobH = ah - usadoH;
            let rc = null;
            if(sobW >= GIFT_MIN_W && ah >= GIFT_MIN_H){
              const rw = Math.min(GIFT_MAX_W, Math.max(GIFT_MIN_W, sobW/2));
              const rh = Math.min(GIFT_MAX_H, Math.max(GIFT_MIN_H, ah));
              rc = {x: MARGIN + usadoW, y: MARGIN, w: rw, h: rh, cols:1};
            } else if(sobH >= GIFT_MIN_H && aw >= GIFT_MIN_W){
              const rw = Math.min(GIFT_MAX_W, Math.max(GIFT_MIN_W, aw/2));
              const rh = Math.min(GIFT_MAX_H, Math.max(GIFT_MIN_H, sobH));
              rc = {x: MARGIN, y: MARGIN + usadoH, w: rw, h: rh, cols: Math.floor(aw/rw)};
            }
            if(rc && !mejorConfig){
              mejorConfig = {cols:cols0, rows:rows0, total:total0, fw:cf.fw, fh:cf.fh,
                             rota:cf.rota, horiz:ch.horiz, tieneRegalo:true, regaloCfg:rc,
                             conMarca:0, extraSinMarca:total0-clientePide, fotosY:MARGIN};
            }
          }

          // B2: reservar fila de regalo arriba/abajo
          for(const giftPos of ['top','bottom']){
            for(const gCols of [1, 2]){
              const gW = aw / gCols;
              if(gW < GIFT_MIN_W || gW > GIFT_MAX_W + 0.5) continue;
              const gH = Math.min(GIFT_MAX_H, Math.max(GIFT_MIN_H, ah * 0.40));
              const areaFH = ah - gH - GAP;
              if(areaFH < cf.fh) continue;
              const fCols = Math.floor(aw / cf.fw);
              const fRows = Math.floor(areaFH / cf.fh);
              if(fCols < 1 || fRows < 1) continue;
              const total = fCols * fRows;
              if(total < clientePide + 1) continue;
              const usadoH = fRows * cf.fh + (fRows-1)*GAP;
              const fotosY = giftPos==='top' ? MARGIN + gH + GAP : MARGIN;
              const gY    = giftPos==='top' ? MARGIN : MARGIN + usadoH + GAP;
              const rc = {x: MARGIN, y: gY, w: gW, h: gH, cols: gCols};
              if(!mejorConfig || !mejorConfig.tieneRegalo){
                mejorConfig = {cols:fCols, rows:fRows, total, fw:cf.fw, fh:cf.fh,
                               rota:cf.rota, horiz:ch.horiz, tieneRegalo:true, regaloCfg:rc,
                               conMarca:0, extraSinMarca:total-clientePide, fotosY};
              }
            }
          }

          // B3: reservar columna de regalo a la derecha
          for(const gRows of [1, 2]){
            const gH = ah / gRows;
            if(gH < GIFT_MIN_H || gH > GIFT_MAX_H + 0.5) continue;
            const gW = Math.min(GIFT_MAX_W, Math.max(GIFT_MIN_W, aw * 0.45));
            const areaFW = aw - gW - GAP;
            if(areaFW < cf.fw) continue;
            const fCols = Math.floor(areaFW / cf.fw);
            const fRows = Math.floor(ah / cf.fh);
            if(fCols < 1 || fRows < 1) continue;
            const total = fCols * fRows;
            if(total < clientePide + 1) continue;
            const rc = {x: MARGIN + areaFW + GAP, y: MARGIN, w: gW, h: gH, cols:1};
            if(!mejorConfig || !mejorConfig.tieneRegalo){
              mejorConfig = {cols:fCols, rows:fRows, total, fw:cf.fw, fh:cf.fh,
                             rota:cf.rota, horiz:ch.horiz, tieneRegalo:true, regaloCfg:rc,
                             conMarca:0, extraSinMarca:total-clientePide, fotosY:MARGIN};
            }
          }
        }
      }
    }

    if(!mejorConfig || !mejorConfig.tieneRegalo) return null;

    const {cols, rows, total, fw, fh, rota, horiz, regaloCfg, conMarca, extraSinMarca, fotosY} = mejorConfig;
    const sw = horiz ? sh.h : sh.w;
    const shh = horiz ? sh.w : sh.h;
    const zw = cols * fw + (cols-1)*GAP;
    const zh = rows * fh + (rows-1)*GAP;

    zonas = [{
      type: t, x: MARGIN, y: fotosY,
      cols, rows, count: total,
      pw: fw, ph: fh, w: zw, h: zh,
      rot: rota, paqId,
      need: clientePide,
      sinMarca: clientePide + (extraSinMarca||0),
      regalo: false
    }];

    if(regaloCfg){
      const nR = regaloCfg.cols || 1;
      for(let i = 0; i < nR; i++){
        zonas.push({
          type:'regalo',
          x: regaloCfg.x + i * (regaloCfg.w + GAP),
          y: regaloCfg.y,
          cols:1, rows:1, count:1,
          pw: regaloCfg.w, ph: regaloCfg.h, w: regaloCfg.w, h: regaloCfg.h,
          rot: false, paqId, need:0, sinMarca:0, regalo:true
        });
      }
    }

    return {
      sheets:[{
        sh, ori: horiz ? 'landscape':'portrait',
        sw, shh,
        layout:{zones: zonas},
        cost: sh.price, paqIds:[paqId]
      }],
      cost: sh.price
    };
  }

  // Múltiples tipos: usar los ejemplos de entrenamiento como referencia
  // Calcular si todos los tipos caben con su respectivo grid + 1 extra + regalo
  // Estrategia simplificada: tipos ordenados por tamaño descendente

  const tiposOrdenados = [...tipos].sort((a,b)=>{
    const sa = PT[a].w * PT[a].h;
    const sb = PT[b].w * PT[b].h;
    return sb - sa;
  });

  // Calcular el espacio mínimo requerido para cada tipo
  let totalAreaNecesaria = 0;
  for(const t of tiposOrdenados){
    const pt = PT[t];
    const minCount = orden[t] + 1; // pedido + 1 extra
    totalAreaNecesaria += minCount * pt.w * pt.h;
  }

  // Área útil de la hoja
  const areaUtil = (hojaW - 2*MARGIN) * (hojaH - 2*MARGIN);
  if(totalAreaNecesaria > areaUtil * 1.5) return null; // imposible

  // Intentar distribución en bandas horizontales/verticales
  const solMulti = intentarDistribucionMultiple(sh, tiposOrdenados, orden, paqId);

  // Intentar layout 2D (tipo grande en banda + tipo pequeño en zona restante con rotación)
  const sol2D = intentarLayout2D(sh, tiposOrdenados, orden, paqId);

  // Gana la más barata que no sea null
  if(!solMulti && !sol2D) return null;
  if(!solMulti) return sol2D;
  if(!sol2D) return solMulti;
  return sol2D.cost <= solMulti.cost ? sol2D : solMulti;
}

function intentarLayout2D(sh, tipos, orden, paqId){
  // Layout 2D: tipo grande en banda horizontal + tipo pequeño en zona restante
  // Modelo basado en plantilla real: 3 diploma + 6 infantil en hoja 8x6
  // - Banda A (tipo grande): fila en un extremo de la hoja
  // - Banda B (tipo pequeño): zona restante, con rotación permitida
  // - Regalo: espacio lateral sobrante en banda B
  if(tipos.length < 2) return null;

  let mejorSol = null;

  // Probar ambas orientaciones de hoja
  const orientaciones = [
    {hw: sh.w, hh: sh.h, horiz: false},
    {hw: sh.h, hh: sh.w, horiz: true},
  ];

  // Probar todas las permutaciones de tipo grande / tipo pequeño
  for(let iGrande = 0; iGrande < tipos.length; iGrande++){
    const tGrande = tipos[iGrande];
    const tiposRestantes = tipos.filter((_,i) => i !== iGrande);

    // Por ahora soportamos 2 tipos (el caso real es exactamente 2)
    if(tiposRestantes.length !== 1) continue;
    const tPeq = tiposRestantes[0];

    const ptG = PT[tGrande];
    const ptP = PT[tPeq];
    const nGrande = orden[tGrande];
    const nPeq   = orden[tPeq];

    for(const ori of orientaciones){
      const hw = ori.hw - 2*MARGIN; // ancho útil
      const hh = ori.hh - 2*MARGIN; // alto útil

      // Probar tipo grande en banda inferior y superior
      for(const posGrande of ['bottom','top']){

        // Probar con y sin rotación del tipo grande
        const combosG = [
          {fw: ptG.w, fh: ptG.h, rot: false},
          {fw: ptG.h, fh: ptG.w, rot: true},
        ];

        for(const cG of combosG){
          // Regla visual rotación: solo si lado largo foto coincide con eje largo del espacio
          if(cG.rot){
            const fotoLargaHoriz = cG.fw >= cG.fh;
            const espacioLargoHoriz = hw >= hh;
            if(fotoLargaHoriz !== espacioLargoHoriz) continue;
          }

          const colsG = Math.floor(hw / cG.fw);
          if(colsG < 1) continue;
          const rowsG = Math.ceil(nGrande / colsG);
          if(rowsG < 1) continue;
          const bandaGH = rowsG * cG.fh + (rowsG-1)*GAP;
          if(bandaGH > hh - GIFT_MIN_H - GAP) continue; // necesitamos espacio para pequeño+regalo

          // Espacio restante para tipo pequeño
          const altoPeq = hh - bandaGH - GAP;
          if(altoPeq <= 0) continue;

          // Probar con y sin rotación del tipo pequeño
          const combosP = [
            {fw: ptP.w, fh: ptP.h, rot: false},
            {fw: ptP.h, fh: ptP.w, rot: true},
          ];

          for(const cP of combosP){
            if(cP.rot){
              const fotoLargaHoriz = cP.fw >= cP.fh;
              const espacioLargoHoriz = hw >= altoPeq;
              if(fotoLargaHoriz !== espacioLargoHoriz) continue;
            }

            const colsP = Math.floor(hw / cP.fw);
            if(colsP < 1) continue;
            const rowsP = Math.ceil(nPeq / colsP);
            if(rowsP < 1) continue;
            const bandaPH = rowsP * cP.fh + (rowsP-1)*GAP;
            if(bandaPH > altoPeq + 0.05) continue;

            // Espacio sobrante lateral en banda pequeño para regalo
            const anchoUsadoP = colsP * cP.fw + (colsP-1)*GAP;
            const sobranteW = hw - anchoUsadoP;

            let regaloCfg = null;
            if(sobranteW >= GIFT_MIN_W && altoPeq >= GIFT_MIN_H){
              // Regalo lateral en banda pequeño
              const rw = Math.min(GIFT_MAX_W, Math.max(GIFT_MIN_W, sobranteW));
              const rh = Math.min(GIFT_MAX_H, Math.max(GIFT_MIN_H, altoPeq));
              regaloCfg = {
                x: MARGIN + anchoUsadoP + GAP,
                y: null, // se calcula después según posGrande
                w: rw, h: rh, cols: 1
              };
            } else if(altoPeq - bandaPH >= GIFT_MIN_H && hw >= GIFT_MIN_W){
              // Regalo en fila sobrante debajo de tipo pequeño
              const rw = Math.min(GIFT_MAX_W, Math.max(GIFT_MIN_W, hw / 2));
              const rh = Math.min(GIFT_MAX_H, Math.max(GIFT_MIN_H, altoPeq - bandaPH - GAP));
              regaloCfg = {
                x: MARGIN,
                y: null,
                w: rw, h: rh, cols: Math.max(1, Math.floor(hw / rw))
              };
            }

            if(!regaloCfg) continue;

            // Calcular posiciones Y según posGrande
            let yGrande, yPeq, yRegalo;
            if(posGrande === 'bottom'){
              yPeq    = MARGIN;
              yRegalo = MARGIN + (regaloCfg.x > MARGIN ? 0 : bandaPH + GAP); // lateral: misma y que pequeño
              yGrande = MARGIN + altoPeq + GAP;
            } else {
              yGrande = MARGIN;
              yPeq    = MARGIN + bandaGH + GAP;
              yRegalo = yPeq + (regaloCfg.x > MARGIN ? 0 : bandaPH + GAP);
            }
            regaloCfg.y = (regaloCfg.x > MARGIN)
              ? (posGrande === 'bottom' ? MARGIN : MARGIN + bandaGH + GAP)
              : yRegalo;

            // Construir zonas
            const totalP = colsP * rowsP;
            const extraP = totalP - nPeq;
            const totalG = colsG * rowsG;
            const extraG = totalG - nGrande;

            const zonas = [];

            // Zona tipo pequeño
            zonas.push({
              type: tPeq,
              x: MARGIN, y: yPeq,
              cols: colsP, rows: rowsP, count: totalP,
              pw: cP.fw, ph: cP.fh,
              w: anchoUsadoP, h: bandaPH,
              rot: cP.rot, paqId,
              need: nPeq,
              sinMarca: nPeq + (SIN_MARCA.has(tPeq) ? extraP : Math.max(0, extraP - Math.max(1, Math.floor(extraP*0.5)))),
              regalo: false
            });

            // Zona tipo grande
            const anchoUsadoG = colsG * cG.fw + (colsG-1)*GAP;
            zonas.push({
              type: tGrande,
              x: MARGIN, y: yGrande,
              cols: colsG, rows: rowsG, count: totalG,
              pw: cG.fw, ph: cG.fh,
              w: anchoUsadoG, h: bandaGH,
              rot: cG.rot, paqId,
              need: nGrande,
              sinMarca: nGrande + (SIN_MARCA.has(tGrande) ? extraG : Math.max(0, extraG - Math.max(1, Math.floor(extraG*0.5)))),
              regalo: false
            });

            // Zonas regalo
            const nR = regaloCfg.cols || 1;
            for(let i = 0; i < nR; i++){
              zonas.push({
                type: 'regalo',
                x: regaloCfg.x + i*(regaloCfg.w + GAP),
                y: regaloCfg.y,
                cols:1, rows:1, count:1,
                pw: regaloCfg.w, ph: regaloCfg.h,
                w: regaloCfg.w, h: regaloCfg.h,
                rot: false, paqId, need:0, sinMarca:0, regalo:true
              });
            }

            const sol = {
              sheets:[{
                sh, ori: ori.horiz ? 'landscape':'portrait',
                sw: ori.hw, shh: ori.hh,
                layout:{zones: zonas},
                cost: sh.price, paqIds:[paqId]
              }],
              cost: sh.price
            };

            if(!mejorSol || sol.cost < mejorSol.cost){
              mejorSol = sol;
            }
          }
        }
      }
    }
  }

  return mejorSol;
}

function intentarDistribucionMultiple(sh, tipos, orden, paqId){
  // Distribuir tipos apilados verticalmente
  // Cada tipo ocupa una banda horizontal
  const hw = sh.w - 2*MARGIN;
  const hh = sh.h - 2*MARGIN;

  let zonas = [];
  let yAcum = 0;
  let tieneRegalo = false;

  for(const t of tipos){
    const pt = PT[t];
    const minCount = orden[t] + 1;

    // Calcular grid que cabe en el ancho disponible
    let mejorGrid = null;
    const combos = [
      {fw:pt.w, fh:pt.h, rot:false},
      {fw:pt.h, fh:pt.w, rot:true},
    ];
    for(const c of combos){
      const cols = Math.floor(hw / c.fw);
      if(cols < 1) continue;
      const rowsNecesarias = Math.ceil(minCount / cols);
      const zonaH = rowsNecesarias * c.fh + (rowsNecesarias-1)*GAP;
      // Regla visual: rot solo valido si lado largo foto queda en el eje largo del espacio
      // Espacio de banda: hw (ancho) vs zonaH (alto)
      // Foto rotada: fw=pt.h, fh=pt.w. Solo rotar si fw>=fh (lado largo horizontal)
      // y el espacio es mas ancho que alto
      if(c.rot){
        const fotoLadoLargoHoriz = c.fw >= c.fh; // lado largo queda horizontal
        const espacioMasAncho = hw >= zonaH;      // espacio es mas ancho que alto
        if(fotoLadoLargoHoriz !== espacioMasAncho) continue; // orientaciones incompatibles
      }
      const total = cols * rowsNecesarias;
      if(!mejorGrid || total < mejorGrid.total ||
         (total === mejorGrid.total && rowsNecesarias < mejorGrid.rows)){
        mejorGrid = {cols, rows:rowsNecesarias, total, fw:c.fw, fh:c.fh, rot:c.rot};
      }
    }

    if(!mejorGrid || mejorGrid.cols < 1) return null;

    const altoZona = mejorGrid.rows * mejorGrid.fh + (mejorGrid.rows-1)*GAP;
    if(yAcum + altoZona > hh + 0.1) return null; // no cabe

    const clienteSinMarca = orden[t];
    const extraSinMarca = mejorGrid.total - clienteSinMarca;
    let conMarca = 0;

    if(!SIN_MARCA.has(t)){
      conMarca = Math.max(1, Math.floor(extraSinMarca * 0.5));
      if(conMarca > 0) tieneRegalo = true;
    }

    zonas.push({
      type:t,
      x: MARGIN, y: MARGIN + yAcum,
      cols: mejorGrid.cols, rows: mejorGrid.rows,
      count: mejorGrid.total,
      pw: mejorGrid.fw, ph: mejorGrid.fh,
      w: mejorGrid.cols * mejorGrid.fw + (mejorGrid.cols-1)*GAP,
      h: altoZona,
      rot: mejorGrid.rot, paqId,
      need: clienteSinMarca,
      sinMarca: clienteSinMarca + (SIN_MARCA.has(t) ? extraSinMarca : extraSinMarca - conMarca),
      regalo: false
    });

    yAcum += altoZona + GAP;
  }

  // Espacio sobrante para regalo
  const sobranteH = hh - yAcum;
  if(!tieneRegalo && sobranteH >= GIFT_MIN_H){
    const rs = calcRegaloSize(hw, sobranteH);
    zonas.push({
      type:'regalo', x:MARGIN, y:MARGIN + yAcum,
      cols:1, rows:1, count:1,
      pw:rs.w, ph:rs.h, w:rs.w, h:rs.h,
      rot:false, paqId, need:0, regalo:true, sinMarca:0
    });
    tieneRegalo = true;
  }

  if(!tieneRegalo) return null;

  return {
    sheets:[{
      sh, ori:'portrait',
      sw:sh.w, shh:sh.h,
      layout:{zones:zonas},
      cost:sh.price, paqIds:[paqId]
    }],
    cost:sh.price
  };
}

// =====================================================
// OPTIMIZACIÓN
// =====================================================
function optimizeSinglePaq(paq){
  // Usar el nuevo algoritmo v2
  return optimizeSinglePaqV2(paq);
}

function optimizeAll(){
  const paqsActivos=paquetes.filter(p=>totalFotos(p.orden)>0);
  if(!paqsActivos.length) return null;

  let allSheets=[], totalCost=0;
  for(const paq of paqsActivos){
    const res=optimizeSinglePaq(paq);
    if(!res) continue;
    allSheets=[...allSheets,...res.sheets];
    totalCost+=res.cost;
  }
  return{sheets:allSheets, cost:totalCost};
}

// RENDER
// =====================================================
function renderAll(plan,wm){
  const ca=document.getElementById('ca');
  document.getElementById('cph').style.display='none';
  ca.querySelectorAll('.sw').forEach(e=>e.remove());

  plan.sheets.forEach((sd,idx)=>{
    const{sh,ori,sw,shh,layout,paqIds}=sd;
    const cw=Math.round(sw*C2P),ch=Math.round(shh*C2P);
    const wrap=document.createElement('div');
    wrap.className='sw';

    // Determinar paquetes en esta hoja
    const paqsEnHoja=(paqIds||[]).map(id=>paquetes.find(p=>p.id===id)).filter(Boolean);
    const paqNames=paqsEnHoja.map(p=>p.nombre).join(' + ');

    const lbl=document.createElement('div');
    lbl.className='slabel';
    lbl.innerHTML=`
      <span class="slabel-num">Hoja ${idx+1}</span>
      <span class="slabel-info"><b>${sh.id}"</b> · ${sw.toFixed(2)}×${shh.toFixed(2)}cm · ${ori==='landscape'?'↔':'↕'} · ${cw}×${ch}px</span>
      ${paqNames?`<span style="font-size:.65rem;color:var(--grn);margin-left:4px">${paqNames}</span>`:''}
      <span class="slabel-cost">$${sh.price}</span>
    `;
    wrap.appendChild(lbl);

    const cv=document.createElement('canvas');
    cv.width=cw;cv.height=ch;
    const baseScale=Math.min(1,(ca.clientWidth-50)/cw);
    cv.dataset.baseW=Math.round(cw*baseScale);
    cv.dataset.baseH=Math.round(ch*baseScale);
    cv.style.width=Math.round(cw*baseScale*(zoomLevel/100))+'px';
    cv.style.height=Math.round(ch*baseScale*(zoomLevel/100))+'px';
    wrap.appendChild(cv);

    const dlr=document.createElement('div');
    dlr.className='dlrow';
    const dlb=document.createElement('button');
    dlb.className='bdl';
    dlb.textContent=`⬇ Descargar hoja ${idx+1} — ${sh.id}" 300dpi`;
    dlb.onclick=()=>dlCv(cv,`fotobernal_h${idx+1}_${sh.id}.jpg`);
    dlr.appendChild(dlb);
    wrap.appendChild(dlr);
    ca.appendChild(wrap);

    drawSheet(cv,sd,wm,paqsEnHoja);

    // Click en canvas: detectar zona y abrir modal de encuadre
    cv.style.cursor='crosshair';
    cv.onclick=(e)=>{
      const rect=cv.getBoundingClientRect();
      const scaleX=cv.width/rect.width;
      const scaleY=cv.height/rect.height;
      const cx=(e.clientX-rect.left)*scaleX;
      const cy=(e.clientY-rect.top)*scaleY;
      // Buscar zona clicada
      for(const z of sd.layout.zones){
        if(z.regalo) continue;
        const zx=Math.round(z.x*C2P), zy=Math.round(z.y*C2P);
        const zw=Math.round(z.w*C2P), zh=Math.round(z.h*C2P);
        if(cx>=zx&&cx<=zx+zw&&cy>=zy&&cy<=zy+zh){
          const paq=paqsEnHoja.find(p=>p.id===z.paqId)||paqsEnHoja[0];
          if(!paq||!paq.fotos.length) return;
          const fotoIdx=paq.fotoAsign&&paq.fotoAsign[z.type]!==undefined?paq.fotoAsign[z.type]:0;
          const type=z.type;
          openCropModal(paq.id,fotoIdx,type);
          return;
        }
      }
    };
  });
}

function drawSheet(cv,sd,wm,paqs){
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,cv.width,cv.height);
  const{layout}=sd;

  for(const z of layout.zones){
    const paq=paqs.find(p=>p.id===z.paqId)||paqs[0];
    const fotoIdx=paq&&paq.fotoAsign&&paq.fotoAsign[z.type]!==undefined?paq.fotoAsign[z.type]:0;
    const fotoSrc=paq&&paq.fotos.length>0?(paq.fotos[fotoIdx]||paq.fotos[0]):null;
    const img=fotoSrc?fotoSrc.img:null;

    const crop=(img&&fotoSrc&&fotoSrc.crops&&fotoSrc.crops[z.type])||null;

    const zxp=Math.round(z.x*C2P), zyp=Math.round(z.y*C2P);
    const pwp=Math.round(z.pw*C2P), php=Math.round(z.ph*C2P);
    const gp=Math.round(GAP*C2P);
    const folio=paq?paq.folio:'';

    let photoIdx=0;
    for(let r=0;r<z.rows;r++){
      for(let c=0;c<z.cols;c++){
        if(photoIdx>=z.count) break;
        const px=zxp+c*(pwp+gp), py=zyp+r*(php+gp);
        drawPhoto(ctx,px,py,pwp,php,z.rot,img,crop);
        // Marca de agua: zona de regalo siempre, posiciones especificas (marcaEn), o fotos que exceden el pedido
        const marcaDesde = z.sinMarca !== undefined ? z.sinMarca : z.need;
        const esExtra = z.marcaEn ? z.marcaEn.includes(photoIdx) : photoIdx >= marcaDesde;
        if(z.regalo || esExtra){
          drawWM(ctx,px,py,pwp,php,{...wm,folio},z.rot);
        }
        photoIdx++;
      }
    }
  }
}

function drawPhoto(ctx,px,py,pw,ph,rot,img,crop){
  // crop = {sx, sy, sw, sh} in source image pixels, or null for center crop
  function getCropRect(imgW, imgH, boxW, boxH){
    if(crop) return crop;
    // Fallback: center crop
    const iar=imgW/imgH, bar=boxW/boxH;
    let sx,sy,sw,sh;
    if(iar>bar){sh=imgH;sw=sh*bar;sx=(imgW-sw)/2;sy=0;}
    else{sw=imgW;sh=sw/bar;sx=0;sy=(imgH-sh)/2;}
    return{sx,sy,sw,sh};
  }

  if(rot){
    ctx.save();
    ctx.translate(px+pw/2,py+ph/2);
    ctx.rotate(Math.PI/2);
    const tmp=pw;pw=ph;ph=tmp;
    if(img){
      const c = crop ? crop : getCropRect(img.width,img.height,pw,ph);
      if(!crop){
        const cropAR=c.sw/c.sh, boxAR=pw/ph;
        let sx=c.sx,sy=c.sy,sw=c.sw,sh=c.sh;
        if(cropAR>boxAR){sw=sh*boxAR;sx=c.sx+(c.sw-sw)/2;}
        else{sh=sw/boxAR;sy=c.sy+(c.sh-sh)/2;}
        ctx.drawImage(img,sx,sy,sw,sh,-pw/2,-ph/2,pw,ph);
      } else {
        ctx.drawImage(img,c.sx,c.sy,c.sw,c.sh,-pw/2,-ph/2,pw,ph);
      }
    } else{ctx.fillStyle='#ebebeb';ctx.fillRect(-pw/2,-ph/2,pw,ph);}
    ctx.strokeStyle='rgba(80,80,80,0.8)';ctx.lineWidth=1;
    ctx.strokeRect(-pw/2,-ph/2,pw,ph);
    ctx.restore();
    return;
  }
  if(img){
    // Si hay crop guardado usarlo directo (ya tiene la proporcion correcta)
    const c = crop ? crop : getCropRect(img.width,img.height,pw,ph);
    if(!crop){
      // Solo reajustar aspecto en el fallback de centro
      const cropAR=c.sw/c.sh, boxAR=pw/ph;
      let sx=c.sx,sy=c.sy,sw=c.sw,sh=c.sh;
      if(cropAR>boxAR){sw=sh*boxAR;sx=c.sx+(c.sw-sw)/2;}
      else{sh=sw/boxAR;sy=c.sy+(c.sh-sh)/2;}
      ctx.drawImage(img,sx,sy,sw,sh,px,py,pw,ph);
    } else {
      ctx.drawImage(img,c.sx,c.sy,c.sw,c.sh,px,py,pw,ph);
    }
  } else{
    ctx.fillStyle='#ebebeb';ctx.fillRect(px,py,pw,ph);
    ctx.fillStyle='#bbb';ctx.font=`${Math.round(Math.min(pw,ph)*.08)}px monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('foto',px+pw/2,py+ph/2);
  }
  ctx.strokeStyle='rgba(80,80,80,0.8)';ctx.lineWidth=1;
  ctx.strokeRect(px,py,pw,ph);
}

function drawWM(ctx,px,py,pw,ph,wm,rotated){
  const logo=wm.logo==='color'?lc:lb;

  if(rotated){
    // Rotar el contexto 90° para que la marca salga orientada correctamente
    ctx.save();
    ctx.translate(px+pw/2,py+ph/2);
    ctx.rotate(Math.PI/2);
    // Ahora pw y ph están intercambiados desde la perspectiva visual
    const rw=ph,rh=pw;
    const wmW=rw*0.54,wmH=rh*0.36;
    const wmX=rw/2-wmW,wmY=rh/2-wmH;
    ctx.fillStyle='rgba(255,255,255,0.62)';
    ctx.fillRect(wmX,wmY,wmW,wmH);
    if(logo){
      const maxW=wmW*0.58,maxH=wmH*0.44,ar=logo.width/logo.height;
      let lw,lh;
      if(maxW/maxH>ar){lh=maxH;lw=lh*ar;}else{lw=maxW;lh=lw/ar;}
      const lx=wmX+(wmW-lw)/2,ly=wmY+wmH*0.04;
      ctx.globalAlpha=0.88;ctx.drawImage(logo,lx,ly,lw,lh);ctx.globalAlpha=1;
      const fs=Math.max(11,wmH*0.14);
      ctx.font=`bold ${fs}px serif`;ctx.fillStyle='rgba(8,8,8,0.85)';
      ctx.textAlign='center';ctx.textBaseline='top';
      const lines=[wm.mes?wm.mes.toUpperCase():'',wm.anio||'',wm.folio?'# '+wm.folio:''].filter(Boolean);
      lines.forEach((l,i)=>ctx.fillText(l,wmX+wmW/2,ly+lh+wmH*0.04+i*fs*1.22));
    }
    ctx.restore();
    return;
  }

  const wmW=pw*0.54,wmH=ph*0.36;
  const wmX=px+pw-wmW,wmY=py+ph-wmH;
  ctx.fillStyle='rgba(255,255,255,0.62)';
  ctx.fillRect(wmX,wmY,wmW,wmH);
  if(logo){
    const maxW=wmW*0.58,maxH=wmH*0.44,ar=logo.width/logo.height;
    let lw,lh;
    if(maxW/maxH>ar){lh=maxH;lw=lh*ar;}else{lw=maxW;lh=lw/ar;}
    const lx=wmX+(wmW-lw)/2,ly=wmY+wmH*0.04;
    ctx.globalAlpha=0.88;ctx.drawImage(logo,lx,ly,lw,lh);ctx.globalAlpha=1;
    const fs=Math.max(11,wmH*0.14);
    ctx.font=`bold ${fs}px serif`;ctx.fillStyle='rgba(8,8,8,0.85)';
    ctx.textAlign='center';ctx.textBaseline='top';
    const lines=[wm.mes?wm.mes.toUpperCase():'',wm.anio||'',wm.folio?'# '+wm.folio:''].filter(Boolean);
    lines.forEach((l,i)=>ctx.fillText(l,wmX+wmW/2,ly+lh+wmH*0.04+i*fs*1.22));
  }
}

function dlCv(cv,name){
  cv.toBlob(blob=>{
    // Incrustar metadata JFIF con 300dpi para que editores muestren medidas correctas
    blob.arrayBuffer().then(buf=>{
      const arr=new Uint8Array(buf);
      // Buscar segmento APP0 (JFIF): bytes 2-3 deben ser FF E0
      // Estructura JFIF APP0: FF E0 [len16] JFIF\0 [ver2] [units] [Xdensity16] [Ydensity16] ...
      // units=1 → pixels per inch; Xdensity=Ydensity=300
      if(arr[2]===0xFF && arr[3]===0xE0 && arr[6]===0x4A){ // FF E0 ... 'J'(0x4A=JFIF)
        arr[11]=1;      // units: 1 = DPI
        arr[12]=1;arr[13]=44; // Xdensity = 300 (0x012C)
        arr[14]=1;arr[15]=44; // Ydensity = 300 (0x012C)
      }
      const fixed=new Blob([arr],{type:'image/jpeg'});
      const u=URL.createObjectURL(fixed);
      const a=document.createElement('a');a.href=u;a.download=name;a.click();
      setTimeout(()=>URL.revokeObjectURL(u),1000);
    });
  },'image/jpeg',1.0);
}

// =====================================================
// MODAL DE ENCUADRE v2 — recuadro proporcional, drag X+Y
// =====================================================
const cropState = {
  paqId: null, fotoIdx: null, type: null,
  rx: 0.5, ry: 0.35,
  drag: false, dragStartX: 0, dragStartY: 0,
  dragStartRx: 0, dragStartRy: 0
};

function openCropModal(paqId, fotoIdx, type) {
  const p = paquetes.find(p => p.id === paqId);
  if (!p || !p.fotos[fotoIdx]) return;
  const f = p.fotos[fotoIdx];
  if (!f.img) { toast('\u26a0 Sube una foto primero'); return; }
  cropState.paqId = paqId;
  cropState.fotoIdx = fotoIdx;
  cropState.type = type;
  if (f.crops && f.crops[type]) {
    const c = f.crops[type];
    cropState.rx = (c.sx + c.sw / 2) / f.img.width;
    cropState.ry = (c.sy + c.sh / 2) / f.img.height;
  } else {
    cropState.rx = 0.5; cropState.ry = 0.35;
  }
  const pt = PT[type];
  document.getElementById('cropModalTitle').textContent =
    'Encuadre: ' + (pt ? pt.label + ' (' + pt.w + 'x' + pt.h + ' cm)' : type) + ' \u2014 ' + p.nombre;
  document.getElementById('cropModal2').classList.add('open');
  requestAnimationFrame(() => requestAnimationFrame(() => renderCropModal()));
}

function closeCropModal2(apply) {
  if (apply) {
    const p = paquetes.find(p => p.id === cropState.paqId);
    if (p && p.fotos[cropState.fotoIdx]) {
      const f = p.fotos[cropState.fotoIdx];
      const pt = PT[cropState.type];
      if (pt && f.img) {
        if (!f.crops) f.crops = {};
        const ar = pt.w / pt.h;
        // sw/sh: el recuadre ocupa el 75% del lado mas corto de la imagen
        // manteniendo la proporcion exacta del tipo
        let sw, sh;
        const imgAR = f.img.width / f.img.height;
        if (imgAR > ar) {
          // imagen mas ancha que el tipo: altura limita
          sh = f.img.height * 0.75; sw = sh * ar;
          if (sw > f.img.width) { sw = f.img.width; sh = sw / ar; }
        } else {
          // imagen mas alta que el tipo: ancho limita
          sw = f.img.width * 0.75; sh = sw / ar;
          if (sh > f.img.height) { sh = f.img.height; sw = sh * ar; }
        }
        let sx = cropState.rx * f.img.width - sw / 2;
        let sy = cropState.ry * f.img.height - sh / 2;
        sx = Math.max(0, Math.min(f.img.width - sw, sx));
        sy = Math.max(0, Math.min(f.img.height - sh, sy));
        f.crops[cropState.type] = {
          sx: Math.round(sx), sy: Math.round(sy),
          sw: Math.round(sw), sh: Math.round(sh)
        };
      }
    }
    const plan = window._lastPlan, wm = window._lastWm;
    if (plan && wm) {
      document.querySelectorAll('.sw canvas').forEach((cv, idx) => {
        const sd = plan.sheets[idx];
        if (!sd) return;
        const paqsEnHoja = (sd.paqIds || []).map(id => paquetes.find(p => p.id === id)).filter(Boolean);
        drawSheet(cv, sd, wm, paqsEnHoja);
      });
    }
    toast('\u2713 Encuadre aplicado');
  }
  document.getElementById('cropModal2').classList.remove('open');
}

function renderCropModal() {
  const p = paquetes.find(p => p.id === cropState.paqId);
  if (!p) return;
  const f = p.fotos[cropState.fotoIdx];
  if (!f || !f.img) return;
  const img = f.img;
  const pt = PT[cropState.type];
  if (!pt) return;
  const wrap = document.getElementById('cropCanvasWrap');
  const cv = document.getElementById('cropCanvas2');
  const availW = wrap.clientWidth || 640;
  const dispW = Math.min(availW, 680);
  const scale = dispW / img.width;
  const dispH = Math.round(img.height * scale);
  cv.width = dispW; cv.height = dispH;
  cv.style.width = dispW + 'px'; cv.style.height = dispH + 'px';
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, dispW, dispH);
  ctx.drawImage(img, 0, 0, dispW, dispH);
  // Calcular recuadre proporcionado al tipo
  const ar = pt.w / pt.h;
  let rw = dispW * 0.75, rh = rw / ar;
  if (rh > dispH * 0.9) { rh = dispH * 0.9; rw = rh * ar; }
  const cx = cropState.rx * dispW;
  const cy = cropState.ry * dispH;
  let rx1 = cx - rw / 2, ry1 = cy - rh / 2;
  rx1 = Math.max(0, Math.min(dispW - rw, rx1));
  ry1 = Math.max(0, Math.min(dispH - rh, ry1));
  // Overlay
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, dispW, ry1);
  ctx.fillRect(0, ry1 + rh, dispW, dispH - ry1 - rh);
  ctx.fillRect(0, ry1, rx1, rh);
  ctx.fillRect(rx1 + rw, ry1, dispW - rx1 - rw, rh);
  // Recuadre dorado
  ctx.strokeStyle = 'rgba(200,168,75,0.95)';
  ctx.lineWidth = 2.5; ctx.setLineDash([]);
  ctx.strokeRect(rx1 + 1, ry1 + 1, rw - 2, rh - 2);
  // Tercios
  ctx.strokeStyle = 'rgba(200,168,75,0.22)'; ctx.lineWidth = 1;
  [1/3, 2/3].forEach(f => {
    ctx.beginPath(); ctx.moveTo(rx1 + rw*f, ry1); ctx.lineTo(rx1 + rw*f, ry1+rh); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx1, ry1 + rh*f); ctx.lineTo(rx1+rw, ry1 + rh*f); ctx.stroke();
  });
  // Esquinas
  [[rx1,ry1],[rx1+rw,ry1],[rx1,ry1+rh],[rx1+rw,ry1+rh]].forEach(([x,y]) => {
    ctx.fillStyle = 'rgba(200,168,75,0.95)';
    ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI*2); ctx.fill();
  });
  // Actualizar indicador de balance izq/der
  updateCropBalance(rx1, rw, dispW);

  cv._dispW = dispW; cv._dispH = dispH;
}

function cropGetXY(e) {
  const cv = document.getElementById('cropCanvas2');
  const rect = cv.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - rect.left) / rect.width, y: (src.clientY - rect.top) / rect.height };
}

function onCropDragStart(e) {
  e.preventDefault();
  const pos = cropGetXY(e);
  cropState.drag = true;
  cropState.dragStartX = pos.x; cropState.dragStartY = pos.y;
  cropState.dragStartRx = cropState.rx; cropState.dragStartRy = cropState.ry;
  document.getElementById('cropCanvas2').style.cursor = 'grabbing';
}

function onCropDragMove(e) {
  if (!cropState.drag) return;
  e.preventDefault();
  const pos = cropGetXY(e);
  cropState.rx = Math.max(0.01, Math.min(0.99, cropState.dragStartRx + pos.x - cropState.dragStartX));
  cropState.ry = Math.max(0.01, Math.min(0.99, cropState.dragStartRy + pos.y - cropState.dragStartY));
  renderCropModal();
}

function onCropDragEnd() {
  cropState.drag = false;
  const cv = document.getElementById('cropCanvas2');
  if (cv) cv.style.cursor = 'grab';
}

document.addEventListener('DOMContentLoaded', () => {
  const cv = document.getElementById('cropCanvas2');
  if (cv) {
    cv.addEventListener('mousedown', onCropDragStart);
    cv.addEventListener('touchstart', onCropDragStart, {passive: false});
    document.addEventListener('mousemove', onCropDragMove);
    document.addEventListener('touchmove', onCropDragMove, {passive: false});
    document.addEventListener('mouseup', onCropDragEnd);
    document.addEventListener('touchend', onCropDragEnd);
    cv.style.cursor = 'grab';
  }
  const modal = document.getElementById('cropModal2');
  if (modal) modal.addEventListener('click', e => { if (e.target === modal) closeCropModal2(false); });
  const wrap = document.getElementById('cropCanvasWrap');
  if (wrap && window.ResizeObserver) {
    new ResizeObserver(() => { if (modal && modal.classList.contains('open')) renderCropModal(); }).observe(wrap);
  }
});

function updateCropBalance(rx1, rw, dispW) {
  const el = document.getElementById('cropCenterIndicator');
  if (!el) return;
  // Espacio a la izquierda y derecha del recuadre en la imagen
  const leftPx  = rx1;               // px desde borde izq hasta recuadre
  const rightPx = dispW - rx1 - rw;  // px desde recuadre hasta borde der
  const total   = leftPx + rightPx;
  if (total <= 0) { el.innerHTML = ''; return; }
  const leftPct  = Math.round(leftPx  / dispW * 100);
  const rightPct = Math.round(rightPx / dispW * 100);
  const diff = Math.abs(leftPct - rightPct);
  // Color: verde si diferencia <= 4%, amarillo <= 10%, rojo mas
  const colorL = diff <= 4  ? '#4bc87a' : diff <= 10 ? '#c8a84b' : '#c84b4b';
  const colorR = diff <= 4  ? '#4bc87a' : diff <= 10 ? '#c8a84b' : '#c84b4b';
  // Barra visual: ancho proporcional al espacio
  const barW = 160; // px totales de la barra
  el.innerHTML =
    '<div style="display:flex;align-items:center;gap:6px;font-size:.72rem;">' +
      '<span style="color:' + colorL + ';font-weight:600;min-width:34px;text-align:right">' + leftPct + '%</span>' +
      '<span style="color:var(--txt2);font-size:.6rem">izq</span>' +
      '<div style="display:flex;align-items:center;gap:0;border:1px solid var(--brd);border-radius:3px;overflow:hidden;height:12px;width:' + barW + 'px">' +
        '<div style="width:' + Math.round(leftPx/dispW*barW) + 'px;background:' + colorL + ';height:100%;opacity:0.7"></div>' +
        '<div style="width:' + Math.round(rw/dispW*barW) + 'px;background:rgba(200,168,75,0.35);height:100%"></div>' +
        '<div style="flex:1;background:' + colorR + ';height:100%;opacity:0.7"></div>' +
      '</div>' +
      '<span style="color:var(--txt2);font-size:.6rem">der</span>' +
      '<span style="color:' + colorR + ';font-weight:600;min-width:34px">' + rightPct + '%</span>' +
      (diff <= 4 ? '<span style="color:#4bc87a;font-size:.65rem">\u2713 centrado</span>' : '') +
    '</div>';
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3000);}

addPaqSilent();
refreshPaquetesUI();
</script>
